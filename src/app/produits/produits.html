<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <tr>
          <th>N°</th><th>Id</th><th>Nom</th><th>Prix</th><th>Date Création</th><th colspan="2">Actions</th>
        </tr>
        @for (produit of produits; track produit.idProduit; let index = $index) {
          <tbody>
            <tr>
              <td>{{index}}</td>
              <td>{{produit.idProduit}}</td>
              <td>{{produit.nomProduit}}</td>
              <td>{{produit.prixProduit}}</td>
              <td>{{produit.dateCreation | date:'dd/MM/yyyy'}}</td>
              <td><a class="btn btn-danger" (click)="supprimerProduit(produit)">Supprimer</a></td>
              <td><a class="btn btn-success" [routerLink]="['/updateProduit', produit.idProduit]">Modifier</a></td>
            </tr>
          </tbody>
        } @empty {
          <h1>Aucun produit trouvé !</h1>
        }
      </table>
    </div>
  </div>
</div>
